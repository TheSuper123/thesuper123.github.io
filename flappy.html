<!doctype html>
<html lang="pl">
  <head>
    <script src="assets/theme.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mały lot — Spinner Games</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/game.css" />
    <script src="assets/storage.js"></script>
    <script src="assets/site.js" defer></script>
    <script src="assets/game-ui.js" defer></script>
    <script src="assets/flappy-classic.js" defer></script>
    <style>
      body {
        min-height: 100dvh;
      }
      main {
        max-width: 440px;
        margin: auto;
        padding: 18px;
      }
      #cabinet {
        position: relative;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
      }
      #bird-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 16px;
        background: #f4f1e8d9;
        text-align: center;
        border: 1px solid #d8d5ca;
        border-radius: 4px;
        padding: 20px;
      }
      #bird-overlay h1 {
        font-size: 30px;
        letter-spacing: -1px;
        margin: 0;
      }
      #bird-overlay p {
        font-size: 13px;
        margin: 0;
      }
      #score {
        display: flex;
        justify-content: space-between;
        font: 11px Mono;
        margin-bottom: 12px;
      }
      header {
        padding: 12px 20px;
        font-size: 12px;
      }
      canvas {
        touch-action: manipulation;
      }
    </style>
    <link rel="stylesheet" href="assets/theme.css" />
  </head>
  <body class="game-page">
    <header><a href="index.html#gry">← Spinner Games / katalog</a></header>
    <main>
      <div id="score">
        <span>Wynik: <b id="bird-score">0</b></span
        ><span>Rekord: <b id="bird-best">0</b></span>
      </div>
      <div id="cabinet">
        <canvas
          id="game"
          width="360"
          height="500"
          aria-label="Plansza gry Mały lot"
        ></canvas>
        <div id="bird-overlay">
          <h1>Mały lot. Wielka frajda.</h1>
          <p id="bird-message">Spacja lub dotknięcie — podskok.</p>
          <button class="button primary" id="bird-start">Zagraj ↗</button>
        </div>
      </div>
    </main>
    <footer>Spinner Games</footer>
  </body>
</html>
