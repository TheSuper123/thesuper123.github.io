<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <script src="assets/theme.js"></script>
    <title>Gramy — Spinner Games</title>
    <meta
      name="description"
      content="Plansza i sterowanie na jednym ekranie. Zagraj w Spinner Games bez reklam."
    />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/player-screen.css" />
    <script src="assets/storage.js" defer></script>
    <script src="assets/site.js" defer></script>
    <script src="assets/auth.js" defer></script>
    <script src="assets/catalog.js?v=100" defer></script>
    <script src="assets/play.js?v=100" defer></script>
  </head>
  <body class="player-page">
    <a class="skip-link" href="#main">Przejdź do gry</a>
    <header class="site-header player-bar">
      <a class="player-home" href="index.html#gry" aria-label="Wróć do katalogu"
        ><img src="assets/mark.svg" width="27" height="27" alt=""
      /></a>
      <h1 id="game-title">Wybierz grę.</h1>
      <nav class="player-tools" aria-label="Narzędzia gry">
        <div id="game-actions" hidden>
          <button
            id="restart-game"
            aria-label="Od początku"
            title="Od początku"
          >
            ↻</button
          ><button
            id="fullscreen-game"
            aria-label="Pełny ekran"
            title="Pełny ekran"
          >
            ⛶
          </button>
        </div>
        <button
          id="player-help"
          aria-label="Zasady i sterowanie"
          title="Zasady i sterowanie"
        >
          ?</button
        ><button
          data-cookie-settings
          aria-label="Ustawienia cookies"
          title="Prywatność"
        >
          ◌
        </button>
      </nav>
    </header>
    <main id="main">
      <div class="game-stage" id="game-stage">
        <p id="game-placeholder" class="game-load-error">
          Otwórz grę z <a href="index.html#gry">katalogu</a>. JavaScript jest
          potrzebny do rozgrywki.
        </p>
      </div>
    </main>
    <dialog id="player-guide" aria-labelledby="guide-title">
      <button class="dialog-close" data-close aria-label="Zamknij zasady">
        ×
      </button>
      <div class="eyebrow" id="game-category">SALON GIER</div>
      <h2 id="guide-title">Zasady i sterowanie</h2>
      <div id="game-guides" hidden>
        <h3 id="game-subtitle"></h3>
        <p id="game-description"></p>
        <h3>Sterowanie</h3>
        <p id="game-controls"></p>
        <p>
          Opcje planszy i tempa znajdziesz pod przyciskiem Opcje w grze. Gra
          zatrzymuje się po otwarciu panelu; wznowisz ją własnym przyciskiem.
        </p>
      </div>
      <a href="index.html#gry">← Wróć do katalogu</a>
    </dialog>
  </body>
</html>
