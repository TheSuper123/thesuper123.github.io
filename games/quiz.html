// ===== LOGIKA =====
let currentQuestion = 0;
const answers = [];
const partyScores = {};
const pogladScores = {};
const ueScores = {};

function showQuestion(){
  if(currentQuestion>=quizData.length){
    showResult();
    return;
  }
  const q = quizData[currentQuestion];
  document.getElementById("question").textContent = `Pytanie ${currentQuestion+1}: ${q.q}`;
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  ["Popieram","Nie mam zdania","Nie popieram"].forEach((text,i)=>{
    const btn = document.createElement("div");
    btn.className="option";
    btn.textContent=text;
    btn.onclick = ()=>selectAnswer(i);
    optionsDiv.appendChild(btn);
  });
  document.getElementById("next-btn").style.display="none";
}

function selectAnswer(i){
  const q = quizData[currentQuestion];
  const score = i==0?2:i==1?1:0;
  // punkty dla polskich partii
  if(q.type=="polska") q.parties.forEach(p=>partyScores[p]=(partyScores[p]||0)+score);
  if(q.type=="poglad") q.parties.forEach(p=>pogladScores[p]=(pogladScores[p]||0)+score);
  if(q.type=="ue") q.parties.forEach(p=>ueScores[p]=(ueScores[p]||0)+score);
  answers.push({question:q.q,answer:i==0?"Popieram":i==1?"Nie mam zdania":"Nie popieram",score:score});
  currentQuestion++;
  document.getElementById("next-btn").style.display="block";
}

document.getElementById("next-btn").onclick=showQuestion;

function showResult(){
  const resultDiv = document.getElementById("result");
  const maxParty = Object.keys(partyScores).reduce((a,b)=>partyScores[a]>partyScores[b]?a:b,"Brak");
  const maxPoglad = Object.keys(pogladScores).reduce((a,b)=>pogladScores[a]>pogladScores[b]?a:b,"Brak");
  const maxUE = Object.keys(ueScores).reduce((a,b)=>ueScores[a]>ueScores[b]?a:b,"Brak");
  resultDiv.innerHTML = `<h3>Twój profil polityczny:</h3>
    <p>Najbliższa partia w Polsce: <b>${maxParty}</b></p>
    <p>Najbliższy pogląd: <b>${maxPoglad}</b></p>
    <p>Najbliższa partia w UE: <b>${maxUE}</b></p>`;
  document.getElementById("options").innerHTML="";
  document.getElementById("next-btn").style.display="none";
  document.getElementById("download-btn").style.display="block";
}

document.getElementById("download-btn").onclick=function(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18);
  doc.text("📊 Quiz Polityczny - Spinner Games", 10, 20);
  doc.setFontSize(12);
  doc.text("Twoje odpowiedzi:", 10, 30);
  let y=40;
  answers.forEach((a,i)=>{
    doc.text(`${i+1}. ${a.question}`,10,y);
    y+=6;
    doc.text(`Odpowiedź: ${a.answer} (punkty: ${a.score})`,12,y);
    y+=8;
    if(y>270){doc.addPage();y=20;}
  });
  doc.addPage();
  doc.setFontSize(14);
  doc.text("Wyniki końcowe:",10,20);
  doc.text(`Najbliższa partia w Polsce: ${Object.keys(partyScores).reduce((a,b)=>partyScores[a]>partyScores[b]?a:b)}`,10,30);
  doc.text(`Najbliższy pogląd: ${Object.keys(pogladScores).reduce((a,b)=>pogladScores[a]>pogladScores[b]?a:b)}`,10,40);
  doc.text(`Najbliższa partia w UE: ${Object.keys(ueScores).reduce((a,b)=>ueScores[a]>ueScores[b]?a:b)}`,10,50);
  doc.save("Quiz_Polityczny_Wyniki.pdf");
}

showQuestion();
