<!doctype html>
<html lang="pl">
  <head>
    <script src="../assets/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sondaże – Spinner Games</title>

    <link rel="icon" href="../assets/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/mark.svg" type="image/svg+xml" />

    <style>
      :root {
        --bg: #020617;
        --card: #0f172a;
        --accent: #38bdf8;
        --text: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, #020617, #000);
        color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      header img {
        height: 32px;
      } /* Zmniejszono nieco wysokość dla lepszego balansu */

      nav button {
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid var(--accent);
        color: var(--text);
        font-size: 14px;
        padding: 6px 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      nav button:hover {
        background: rgba(56, 189, 248, 0.2);
      }

      main {
        max-width: 900px; /* Nieco węższy dla lepszej czytelności na desktopie */
        margin: auto;
        padding: 15px;
      }
      .card {
        background: linear-gradient(180deg, #0f172a, #020617);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        margin-bottom: 25px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      h2 {
        text-align: center;
        font-size: clamp(1.2rem, 5vw, 1.8rem);
        margin-bottom: 20px;
        color: var(--accent);
      }

      /* Stylizacja kontenera Flourish dla lepszego wyglądu na mobile */
      .flourish-embed {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 12px;
        padding: 10px;
        min-height: 400px; /* Rezerwacja miejsca podczas ładowania */
      }

      footer {
        text-align: center;
        opacity: 0.6;
        padding: 25px 10px;
        font-size: 12px;
      }
    </style>
    <link rel="stylesheet" href="../assets/site.css" />
    <link rel="stylesheet" href="../assets/game.css" />
    <script src="../assets/storage.js"></script>
    <script src="../assets/progress.js"></script>
    <script src="../assets/site.js" defer></script>
    <script src="../assets/game-ui.js" defer></script>
    <link rel="stylesheet" href="../assets/theme.css" />
  </head>

  <body class="game-page">
    <header>
      <img src="../assets/mark.svg" alt="SpinnerRealYT" />
      <nav id="nav"></nav>
    </header>

    <main>
      <div class="card">
        <h2>Średnie* sondaże Partii</h2>

        <div
          class="flourish-embed flourish-chart"
          data-src="visualisation/27035462"
        ></div>
        <script src="https://public.flourish.studio/resources/embed.js"></script>

        <p
          style="
            font-size: 12px;
            opacity: 0.6;
            text-align: center;
            margin-top: 15px;
            line-height: 1.4;
          "
        >
          * Sondaże uśrednione na podstawie bieżących badań opinii publicznej z
          różnych ośrodków badawczych.
        </p>
      </div>
    </main>

    <footer>© 2026 Spinner Games</footer>

    <script>
      // Menu nawigacyjne
      const games = [{ file: "../index.html", name: "Menu" }];

      const nav = document.getElementById("nav");

      games.forEach((g) => {
        const b = document.createElement("button");
        b.textContent = g.name;
        b.onclick = () => (location.href = g.file);
        nav.appendChild(b);
      });
    </script>
  </body>
</html>
